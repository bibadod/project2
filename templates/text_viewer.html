<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ filename }}</title>

    <style>

        * {
            box-sizing: border-box;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                "Helvetica Neue",
                Arial,
                sans-serif;
        }


        body {

            margin: 0;

            min-height: 100vh;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.05),
                    rgba(0, 0, 0, 0.05)
                ),
                url("https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=2400&q=90");

            background-size: cover;

            background-position: center;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .window {

            width: min(900px, 90%);

            height: 75vh;

            display: flex;

            flex-direction: column;

            border-radius: 14px;

            overflow: hidden;

            background: rgba(245, 245, 245, 0.88);

            backdrop-filter: blur(30px);

            -webkit-backdrop-filter: blur(30px);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.35);
        }


        .titlebar {

            height: 42px;

            display: flex;

            align-items: center;

            position: relative;

            padding: 0 15px;

            background:
                rgba(235, 235, 235, 0.8);

            border-bottom:
                1px solid rgba(0, 0, 0, 0.1);
        }


        .buttons {

            display: flex;

            gap: 8px;
        }


        .circle {

            width: 12px;

            height: 12px;

            border-radius: 50%;
        }


        .red {
            background: #ff5f57;
        }


        .yellow {
            background: #ffbd2e;
        }


        .green {
            background: #28c840;
        }


        .title {

            position: absolute;

            left: 50%;

            transform: translateX(-50%);

            font-size: 13px;

            font-weight: 500;

            color: #333;
        }


        .content {

            flex: 1;

            overflow: auto;

            padding: 25px;

            background:
                rgba(255, 255, 255, 0.72);
        }


        pre {

            margin: 0;

            white-space: pre-wrap;

            word-wrap: break-word;

            font-family:
                "SF Mono",
                Menlo,
                Monaco,
                Consolas,
                monospace;

            font-size: 14px;

            line-height: 1.6;

            color: #222;
        }

    </style>

</head>


<body>


<div class="window">


    <div class="titlebar">


        <div class="buttons">

            <div class="circle red"></div>

            <div class="circle yellow"></div>

            <div class="circle green"></div>

        </div>


        <div class="title">

            {{ filename }}

        </div>


    </div>


    <div class="content">

        <pre>{{ text }}</pre>

    </div>


</div>


</body>

</html>
